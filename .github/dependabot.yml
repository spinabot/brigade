# Dependabot configuration
# https://docs.github.com/en/code-security/reference/supply-chain-security/dependabot-options-reference
#
# Goal: dependencies stay current WITHOUT anyone shepherding pull requests, and
# without routine bumps crowding out genuine contributions.
#
# How that works here:
#   - grouped        one PR per group, not one per package (13 open PRs became
#                    the norm before this; several sat stale for two months)
#   - monthly        a cadence a person can actually absorb
#   - cooldown       a release must age before Dependabot proposes it, so a
#                    compromised or immediately-yanked version is caught by the
#                    ecosystem before it can be auto-merged here
#   - auto-merged    patch/minor land on their own once CI is green
#                    (see .github/workflows/dependabot-auto-merge.yml)
#
# Majors deliberately still open a PR and wait for a human — auto-merging
# zod 3 -> 4 or TypeScript 5 -> 6 would break the build, and that is a decision,
# not a chore. The 30-day major cooldown keeps them rare.
#
# Security updates are a separate channel and are NOT affected by any of this:
# a real advisory opens a PR immediately, ignoring cadence and cooldown.

version: 2

updates:
  # npm dependencies
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
      semver-patch-days: 3
      semver-minor-days: 7
      semver-major-days: 30
    groups:
      production:
        dependency-type: production
        update-types:
          - minor
          - patch
      development:
        dependency-type: development
        update-types:
          - minor
          - patch
    # Pi SDK is pinned exact on purpose — bump it deliberately, not via Dependabot.
    # These moved from @mariozechner/* to @earendil-works/*; the old names matched
    # nothing, so the pin was unprotected. Three of the four are also held by
    # `overrides` in package.json — a Dependabot bump here would fight that.
    ignore:
      # Major bumps are a decision, not a chore — TypeScript 5 -> 7, zod 3 -> 4 or
      # @slack/web-api 7 -> 8 need code changes and land when someone plans them,
      # not because a bot opened a PR that then sits failing CI for two months.
      # `update-types` ignore conditions do NOT apply to Dependabot SECURITY
      # updates, so if an advisory can only be fixed by a major, the PR is still
      # raised. This suppresses routine churn, not vulnerability coverage.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@earendil-works/pi-ai"
      - dependency-name: "@earendil-works/pi-agent-core"
      - dependency-name: "@earendil-works/pi-coding-agent"
      - dependency-name: "@earendil-works/pi-tui"

  # GitHub Actions used by our workflows
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    ignore:
      # Same policy as npm: action majors (checkout 4 -> 7, codeql-action 3 -> 4)
      # change behaviour and are upgraded deliberately, not by a standing PR.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      actions:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
