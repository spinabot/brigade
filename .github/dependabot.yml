# Dependabot configuration
# https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2

# Version updates are OFF; security updates are ON.
#
# `open-pull-requests-limit: 0` disables routine version-bump PRs for an
# ecosystem. It has no effect on Dependabot SECURITY updates, which have their
# own internal limit — so a real advisory still opens a PR, while "bump X from
# 1.2.3 to 1.2.4" churn does not. Routine upgrades are done deliberately
# instead, in batches, when someone is actually free to test them.
updates:
  # npm dependencies
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    groups:
      production:
        dependency-type: production
        update-types:
          - minor
          - patch
      development:
        dependency-type: development
        update-types:
          - minor
          - patch
    # Pi SDK is pinned exact on purpose — bump it deliberately, not via Dependabot.
    # These moved from @mariozechner/* to @earendil-works/*; the old names matched
    # nothing, so the pin was unprotected. Three of the four are also held by
    # `overrides` in package.json — a Dependabot bump here would fight that.
    ignore:
      - dependency-name: "@earendil-works/pi-ai"
      - dependency-name: "@earendil-works/pi-agent-core"
      - dependency-name: "@earendil-works/pi-coding-agent"
      - dependency-name: "@earendil-works/pi-tui"

  # GitHub Actions used by our workflows
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    groups:
      actions:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
